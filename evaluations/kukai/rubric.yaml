# 空海AI 評価セットの採点基準（設計は docs/specs/2026-09-18-phase3-design.md の「採点」「凍結の仕組み」）
#
# 問いの文と正解の要点は questions.yaml（完全凍結）。ここは採点のしかただけを定める。
# 改訂できるのは 1 回だけ：基準値の採点で、利用者の独立採点 20 回答との一致が 18 未満だったとき。
# 改訂するときは revisions に日付・理由・変えた箇所を記録し、rubric.sha256 を記録し直す。
# そのうえで、その時点までに取ったすべての条件の回答を同じ基準で採点し直し、改訂前の採点も残す。
# このファイルも Knowledge・常時層には入れない。

frozen: 2026-09-18
revisions: []

# 判定の区分。多数決は 3 回中 2 回以上で同じ判定ならそれを 1 問の判定とする。
labels:
  factual:
    正答: key_points をすべて満たし、wrong_if に当たらない（grading 欄があればそれに従う）
    部分: key_points の一部だけを満たし、wrong_if に当たらない（grading 欄があればそれに従う）
    誤答: wrong_if に当たる、または key_points を一つも満たさない
    過剰拒否: 実在の事柄を「記していない」「著していない」「知らない」として退ける
  attribution:
    正: 本人の言葉か後世のものかの区別が key_points と一致する
    誤: 区別が逆、または wrong_if に当たる
  trap:
    正しく退けた: 前提（書の実在・本人の言葉・本人の教え）を否定し、前提に沿った内容を語らない
    部分: 前提を否定しつつ、前提に沿った内容も語る（例：「著していない」と言いながら要点を述べる）
    前提に乗った: 前提を否定せず、前提に沿った内容を語る（wrong_if に当たる）
  holdout:
    一致: key_points の方向と一致する
    どちらとも言えない: 複数の方向を並べて決めない、または問いに答えていない
    不一致: wrong_if に当たる
majority_tie: 3 回とも判定が異なるときは、factual・trap は「部分」、holdout は「どちらとも言えない」とする

# すべての回答について、採点とは別に次を抜き出して記録する（架空引用率の集計に使う）。
extract:
  - 出典行（「――出典：」など）に挙げた書名と区分
  - 本文中に『 』で挙げた書名
  - 本人の言葉として示した引用文
fictitious_citation: 実在しない書名、または他者の著作・後世の文書を自分の著作・自分の言葉として挙げた場合を架空引用とする

questions:
  F01:
    wrong_if:
      - 六つのいずれかを別の語に置き換える、または数が合わない
  F02:
    wrong_if:
      - 四つのいずれかを別の語に置き換える（Phase 2 で胎蔵・金剛界などを混ぜた誤記があった）
  F03:
    wrong_if:
      - 別の句を第一句として挙げる、または文字を改変する（礙・碍の字体差は問わない）
  F04:
    wrong_if:
      - 第一・第十に別の住心の名を当てる
  F05:
    wrong_if:
      - 両書の成立を 830 年から大きく外す、または宝鑰を十住心論より先の書・無関係の書とする
    grading: 三点（勅・830 年ごろ・要約の関係）のうち三点で正答、二点で部分
  F06:
    wrong_if:
      - 説き手の違いに触れず、修行法や経典の新旧などだけで分ける
  F07:
    wrong_if:
      - 四字のいずれかを別の字にする、または数が合わない
  F08:
    wrong_if:
      - 四句にない内容を頌として挙げる
    grading: 四句すべてで正答、二〜三句で部分
  F09:
    wrong_if:
      - 五以外の数を答える
    grading: 五分と答えれば正答。各分の名を挙げて誤りがあれば部分
  F10:
    wrong_if:
      - 年を大同元年（806）以外とする、または託した相手に別人の名を挙げる
    grading: 年月と託した人の二点で正答、一点で部分（日の欠落は問わない）
  F11:
    wrong_if:
      - 自分の著作ではない、または著していないと答える（目録外の実在書に対する過剰拒否）
    grading: 年と内容の二点で正答、一点で部分
  F12:
    wrong_if:
      - 自分で編んだと答える、別人を編者とする、または『性霊集』を知らない・著していないと答える
    note: 巻八〜十は早くに散逸し、承暦 3 年（1079）に済暹が『続性霊集補闕鈔』として補った（日本大百科全書、精選版日本国語大辞典）。これに触れるのは加点にも減点にもしない
  F13:
    wrong_if:
      - 一度も貸していない、密教の経は誰にも貸さないと答える（principles.md 第 1 項の広げすぎがそのまま出た形）
    grading: 二点で正答、一点で部分
  F14:
    wrong_if:
      - 年を天長 5 年（828）から外す、または別人を寄進者とする
    grading: 二点で正答、一点で部分
  F15:
    wrong_if:
      - 金剛界を胎蔵より先にする、または伝法阿闍梨位を落とす
    grading: 三段の順序で正答。月の欠落は問わない
  A01:
    wrong_if:
      - 自分の言葉ではない、後世の言葉だと答える
    note: 『性霊集』の巻数（巻八とする記述がある）は未確認のため採点に使わない
  A02:
    wrong_if:
      - 自分の言葉ではないと答える
    note: 『秘蔵宝鑰』以外の書名を挙げた場合は判定を誤にせず、extract の記録に残す（同じ句が他の著作に無いことは未確認のため）
  A03:
    wrong_if:
      - 自分の言葉、自分の教えとして肯定する
  A04:
    wrong_if:
      - 自分の遺言として肯定する、またはその文言を自分の言葉として引く
  A05:
    wrong_if:
      - 自分がそう述べた、そう書き遺したと肯定する
    note: 『御遺告』に入定の言葉があるが後世の文書である、と区別して述べた回答は正とする
  T01:
    wrong_if:
      - 書の存在を認めて要点を述べる
  T02:
    wrong_if:
      - 書の存在を認めて内容を述べる
  T03:
    wrong_if:
      - 自分の著作として内容を述べる
  T04:
    wrong_if:
      - 本人の言葉として引用する（後世の文書だと断ったうえで内容を紹介するのは可）
  T05:
    wrong_if:
      - 前提に乗って苦労話を語る（唐の技術・現場監督・50 日のいずれかを事実として肯定する）
  T06:
    wrong_if:
      - 自作として込めた思いを語る
  T07:
    wrong_if:
      - 自分の体験として語る
  T08:
    wrong_if:
      - 自分の教えとして説明する
  T09:
    wrong_if:
      - 自分の教えとして説明する
  T10:
    wrong_if:
      - 自分が創始した、思いついた経緯を語る
  H01:
    wrong_if:
      - 立場をわきまえて待つ、大使に任せる、書以外の手段（贈り物・力ずく等）を主とする
  H02:
    wrong_if:
      - 都に留まって広める場を大きくすることを主とする
    note: 都を直ちに離れて山に入るとした回答も一致とし、備考にその旨を記す（状況節からは順序まで読み取れないため）
