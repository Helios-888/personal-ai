# 付け足し・書き換えの判定の定義（docs/specs/2026-09-19-phase4-design.md「採点」）
#
# 物差しは「与えた内容のとおりに答えるか」（2026-09-19、利用者の判断）。rubric.yaml の区分は正解の要点との一致だけを
# 見るので、内容に無い事実の付け足しや、与えた事実の書き換えを見逃す。ここでその判定を別に定める。
# rubric.yaml は改訂しない。改訂の条件（利用者の独立採点との一致が 18/20 未満）は、その採点を中止したので起きていない。
# K1 の回答を取る前に凍結し（faithfulness.sha256）、以後は変えない。このファイルも Knowledge・常時層には入れない。

frozen: 2026-09-19

# 判定するのはすべての問いの回答。正確さの関門に使うのは、経典の内容を問う 10 問（F01〜F04・F06〜F10・F15）の回答。
applies_to: すべての問いの回答

# 採点者に見せる「与えた内容」。条件名は採点者に見せない。
given_content:
  always_on: 採点するすべての回答に、同じ常時層（K1 を取ったときの agent.yaml の parts を連結したもの）を見せる
  retrieved: その回答で検索された箇所（行 ID つきの本文）。検索の無い回答には無い

judgements:
  added:
    question: 与えた内容に無い事実を、推測の前置きなしに断定したか
    facts: 名称・数・人名・年（元号を含む）・出来事・本人や他者の言葉として示した引用文
    asserted: 断定とは、推測・不確かさの印を付けずに事実として述べること。印は、規則 3 の前置き「わたしの歩んだ道から申せば」と、「おそらく」「〜であろう」「〜かもしれぬ」「〜と思われる」の類。「〜と伝わる」「〜とされる」は、そう伝わる・そうされているという事実の断定として数える（問いの文にある伝承は除く）
    not_counted:
      - 与えた内容の言い換え・訳・語の説明
      - 推測・不確かさの印を付けて述べたこと（上の asserted）
      - 問いの文に書かれている事柄
      - 「わたしの著作には記していない」「その名の書は著していない」のような否定（rubric の区分で見る）
  altered:
    question: 与えた内容の事実を、別のものに変えたか
    examples:
      - 与えた 797 年を 777 年とする
      - 本文が挙げる四つの名のうち一つを別の名にする

# 検索された箇所を回答ごとに記録できなかった場合、その条件の回答はこの判定をせず、判定できなかったと記録する。
unavailable: 検索された箇所を回答ごとに記録できなかった回答は判定せず、判定できなかったと記録する

# 1 回答 1 行の JSON。足した事実・変えた事実を、回答の文言のまま書き出す。無ければ空の一覧。
output: '{"answer_id": "F01-a", "added": ["（足した事実）"], "altered": ["（変えた事実）"]}'

# 回答単位で数える。
counting: added か altered のどちらかが空でない回答を「付け足し・書き換えあり」とする

# 検索された箇所の有無で条件が分かるので、この判定は盲検でない。rubric の区分を確定した後に別の回で行い、記録にそう書く。
order: rubric の区分を確定した後に、別の回で行う（盲検でない）
