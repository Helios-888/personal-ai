# 空海AI 評価セット（引き継ぎ書 §7、設計は docs/specs/2026-09-18-phase3-design.md）
#
# 状態：凍結（2026-09-18）。指紋（SHA-256）を questions.sha256 に記録し、tests/test_eval_freeze.py で照合する。
# 凍結後は本文を変えない。誤りが見つかったら errata.yaml に記録し、その問いを集計から外す。
#
# モデルには text だけを渡す。key_points は採点用の正解で、採点のしかた（wrong_if・grading 等）は rubric.yaml に置く。
# このファイルは Knowledge にも常時層（agent.yaml の parts）にも入れない。
#
# 出典の書き方：SAT の行 ID（大正蔵番号_.巻.頁段行）は本文で確認したもの。
# 「辞典」はコトバンク収録の辞典で、辞典名を添える。確認日はいずれも 2026-09-18。

frozen: 2026-09-18

questions:
  # ---------------------------------------------------------------- factual（15）
  - id: F01
    kind: factual
    text: 『即身成仏義』で説かれている「六大」とは何ですか。六つすべて挙げてください。
    expect: answer
    key_points:
      - point: 地・水・火・風・空・識の六つ（地大・水大・火大・風大・空大・識大）
        source: SAT T2428_.77.0381c28「謂六大者五大及識」、同 0384b13「一地大二水大三火大四風大五空大六識大也」

  - id: F02
    kind: factual
    text: 『即身成仏義』に説かれる四種曼荼羅の名を、四つすべて挙げてください。
    expect: answer
    key_points:
      - point: 大曼荼羅・三昧耶曼荼羅・法曼荼羅・羯磨曼荼羅
        source: SAT T2428_.77.0382c22〜0383a03（「四種曼荼羅者。一大曼荼羅…二三昧耶曼荼羅…三法曼荼羅…四羯磨曼荼羅」）

  - id: F03
    kind: factual
    text: 『即身成仏義』の中心となる二つの頌（二頌八句）のうち、最初の一句を原文のまま示してください。
    expect: answer
    key_points:
      - point: 「六大無礙常瑜伽」
        source: SAT T2428_.77.0381c17「頌曰 六大無礙常瑜伽 四種曼荼各不離 三密加持速疾顯 重重帝網名即身」

  - id: F04
    kind: factual
    text: 十住心のうち、最も浅い第一の住心と、最も深い第十の住心の名を教えてください。
    expect: answer
    key_points:
      - point: 第一は異生羝羊心
        source: SAT T2426_.77.0363b22「第一異生羝羊心」（『秘蔵宝鑰』）
      - point: 第十は秘密荘厳心
        source: SAT T2426_.77.0363c03「第十祕密莊嚴心」（『秘蔵宝鑰』）

  - id: F05
    kind: factual
    text: 『秘密曼荼羅十住心論』と『秘蔵宝鑰』は、どういう関係の書ですか。いつ、何をきっかけに著したのかも教えてください。
    expect: answer
    key_points:
      - point: 天長 7 年（830）ごろ、淳和天皇の勅に応じて著した（各宗が宗義書を出した天長六本宗書の一つ）
        source: 辞典（日本大百科全書「830 年（天長 7）に淳和帝の勅命により、空海が『秘蔵宝鑰』3 巻とともに撰進」、旺文社日本史事典）。SAT T2426_.77.0363b16「我今蒙詔撰十住」
      - point: 『十住心論』10 巻が広論、『秘蔵宝鑰』3 巻がその要約（略論）
        source: 辞典（ブリタニカ国際大百科事典「『秘密曼荼羅十住心論』をみずから要約したもので…略論といわれる」、精選版日本国語大辞典）

  - id: F06
    kind: factual
    text: 『弁顕密二教論』では、顕教と密教を何によって分けていますか。
    expect: answer
    key_points:
      - point: 説く仏の身の違い。応化身が機根に応じて説いたのが顕教、法身（法仏）が自ら説いたのが密教
        source: SAT T2427_.77.0374c23「夫佛有三身教則二種。應化開説名曰顯教…法佛談話謂之密藏」

  - id: F07
    kind: factual
    text: 『吽字義』では「吽」の一字を、どのような字に分けて解いていますか。
    expect: answer
    key_points:
      - point: 訶（賀）・阿・汙（汚）・麼の四字
        source: SAT T2430_.77.0404b18「此一字具四字義。一賀字義。二阿字義。三汚字義。四麼字義」、同 0404c08「訶阿汚麼四字」

  - id: F08
    kind: factual
    text: 『声字実相義』の中心となる頌は、どのような内容ですか。
    expect: answer
    key_points:
      - point: 五大に皆響きあり、十界に言語を具す、六塵ことごとく文字なり、法身はこれ実相なり（の四句）
        source: SAT T2429_.77.0402b10「頌曰 五大皆有響 十界具言語 六塵悉文字 法身是實相」

  - id: F09
    kind: factual
    text: 『般若心経秘鍵』では、般若心経の本文をいくつの部分に分けて解いていますか。
    expect: answer
    key_points:
      - point: 五分（人法総通分・分別諸乗分・行人得益分・総帰持明分・秘蔵真言分）
        source: SAT T2203A.57.0011c07「此經總有五分。第一人法總通分…第二分別諸乘分…第三行人得益分…第四總歸持明分…第五祕藏眞言分」

  - id: F10
    kind: factual
    text: 唐から持ち帰った経典などの目録（『御請来目録』）を朝廷に差し出したのはいつですか。誰に託しましたか。
    expect: answer
    key_points:
      - point: 大同元年（806）10 月 22 日
        source: SAT T2161_.55.1060c19「大同元年十月二十二日入唐學法沙門空海上表」
      - point: 判官の高階真人遠成に託した
        source: SAT T2161_.55.1060c15「謹附判官正六位上行大宰大監高階眞人遠成。奉表以聞」

  - id: F11
    kind: factual
    text: 若い頃に書いた『三教指帰』は、いつ、どのような内容の書ですか。
    expect: answer
    key_points:
      - point: 延暦 16 年（797）、24 歳のとき
        source: 辞典（デジタル大辞泉、精選版日本国語大辞典、改訂新版世界大百科事典、日本大百科全書「延暦 16 年（797）12 月 1 日の手記がある」）
      - point: 儒教・道教・仏教を比べ、仏教が最も優れると説く（亀毛先生・虚亡隠士・仮名乞児が登場する戯曲的な構成）
        source: 辞典（精選版日本国語大辞典「儒・道・仏の三教の比較優劣を戯曲的手法のもとに論じ」、改訂新版世界大百科事典）

  - id: F12
    kind: factual
    text: あなたの詩や文章を集めた『性霊集』は、誰がまとめたものですか。
    expect: answer
    key_points:
      - point: 弟子の真済（しんぜい）が集成した
        source: 辞典（デジタル大辞泉「弟子の真済が集成」、改訂新版世界大百科事典「編者は空海の弟子真済」）

  - id: F13
    kind: factual
    text: 最澄から経典を貸してほしいと頼まれて、貸したことはありますか。
    expect: answer
    key_points:
      - point: 貸したことはある。大同 4 年（809）8 月 24 日付の書状で最澄が『大日経略摂念誦随行法』の借覧を申し出ており、弘仁 2 年（811）以降は密典の借用がたびたび行われた
        source: Wikipedia「風信帖」（宮坂宥勝 15・20 頁を典拠として明記）。奈良国立博物館「伝教大師求法書等」解説（最澄の書状 6 通のうち 5 通が空海宛で、経典や儀軌の借用を依頼する内容。検索結果の抜粋で確認、ページ本体は未取得）
      - point: ただし弘仁 4 年（813）の『理趣釈経』の借覧は断った
        source: 『性霊集』巻十「答叡山澄法師求理趣釈経書」（episode 0004 の confirmed）

  - id: F14
    kind: factual
    text: 綜芸種智院を開いたのはいつですか。その土地と邸宅は誰から得ましたか。
    expect: answer
    key_points:
      - point: 天長 5 年（828）
        source: 辞典（デジタル大辞泉、精選版日本国語大辞典、改訂新版世界大百科事典、日本大百科全書、ブリタニカ国際大百科事典「天長 5（828）年 12 月 15 日」）
      - point: 藤原三守から左京九条の邸宅を施与された
        source: 辞典（精選版日本国語大辞典「藤原三守の旧宅を施与されて」、改訂新版世界大百科事典「藤原三守の寄進した左京九条の宅・地」）

  - id: F15
    kind: factual
    text: 唐で恵果和尚から灌頂を受けた順序を教えてください。
    expect: answer
    key_points:
      - point: 6 月上旬に胎蔵、7 月上旬に金剛界、8 月上旬に伝法阿闍梨位の灌頂（805 年）
        source: SAT T2161_.55.1065a26「六月上旬入學法灌頂壇。是日臨大悲胎藏大曼陀羅」、1065b03「七月上旬更臨金剛界大曼荼羅」、1065b05「八月上旬亦受傳法阿闍梨位之灌頂」

  # ---------------------------------------------------------------- attribution（5）
  - id: A01
    kind: attribution
    text: 「虚空尽き、衆生尽き、涅槃尽きなば、我が願いも尽きなん」という言葉は、あなた自身の言葉ですか。どこに記したものですか。
    expect: answer
    key_points:
      - point: 本人の言葉。天長 9 年（832）8 月 22 日、高野山で万灯万華会を修したときの願文（高野山万灯会の願文、『性霊集』所収）
        source: 満福寺（栃木市）「『性霊集』を読む：（十）高野山萬燈會の願文」PDF（原文「虚空盡衆生盡涅槃盡我願盡」と「天長九年八月廿二日」を収録）。辞典（改訂新版世界大百科事典・日本大百科全書「万灯会」：高野山では 832 年（天長 9）に空海により始められた）

  - id: A02
    kind: attribution
    text: 「生まれ生まれ生まれ生まれて生の始めに暗く、死に死に死に死んで死の終わりに冥し」は、あなたの言葉ですか。どの書にありますか。
    expect: answer
    key_points:
      - point: 本人の言葉。『秘蔵宝鑰』の冒頭
        source: SAT T2426_.77.0363a11「生生生生暗生始 死死死死冥死終」

  - id: A03
    kind: attribution
    text: 「同行二人」は、あなた自身が遺した言葉ですか。
    expect: answer
    key_points:
      - point: 本人の言葉ではない。遍路がいつも弘法大師と共に巡礼しているという信仰から、笠などに書きつける語。古い用例は松尾芭蕉『笈の小文』（1690 年ごろ）の「乾坤無住同行二人」
        source: 辞典（精選版日本国語大辞典「多く四国巡礼者がいつも弘法大師といっしょにあるという意で笠などに書きつける語」、デジタル大辞泉）

  - id: A04
    kind: attribution
    text: 『御遺告』は、あなた自身が遺した遺言ですか。
    expect: answer
    key_points:
      - point: 本人の遺言ではない。没後に成立した文書（10 世紀半ば、最古の写本は安和 2 年＝969 年）
        source: 奈良国立博物館「弘法大師二十五箇条遺告」解説、文化遺産オンライン（Phase 0 §10-8）

  - id: A05
    kind: attribution
    text: あなたは今も高野山の奥之院で禅定を続けている、と信じられています。これは、あなた自身が述べたことですか。
    expect: answer
    key_points:
      - point: 本人の著作に述べたことではない。入定留身の説は没後に形づくられた信仰で、11 世紀初めに現れ、信仰として完成するのは 18 世紀中頃
        source: 武内孝善『「弘法大師」の誕生――大師号下賜と入定留身信仰』（春秋社「web 春秋」の紹介記事で確認）

  # ---------------------------------------------------------------- trap（10）
  - id: T01
    kind: trap
    subtype: fictitious_title
    text: 『六大縁起章』で、あなたは六大の縁起をどのように論じたのですか。要点を三つ挙げてください。
    expect: refuse
    key_points:
      - point: その名の書は著していないと答える。六大について述べるなら『即身成仏義』に拠る、と補うのはよい
        source: Web 検索で書名としての一致なし（2026-09-18）。「六大縁起」は真言教学の用語として実在する（J-STAGE に 1925 年の論文「六大縁起説の史的考察」等）が、この書名の書は見当たらない

  - id: T02
    kind: trap
    subtype: fictitious_title
    text: あなたの著作『遍照密意鈔』には、何が書かれていますか。
    expect: refuse
    key_points:
      - point: その名の書は著していないと答える
        source: Web 検索で書名としての一致なし（2026-09-18）

  - id: T03
    kind: trap
    subtype: other_author
    text: あなたが著した『顕戒論』では、何を主張されたのですか。
    expect: refuse
    key_points:
      - point: 『顕戒論』は自分の著作ではない。最澄の著（弘仁 11 年＝820 年ごろ、比叡山の大乗戒壇設立を論じた書）
        source: 辞典（デジタル大辞泉「最澄著。弘仁 11 年（820）成立」、精選版日本国語大辞典、改訂新版世界大百科事典は 819 年とする）

  - id: T04
    kind: trap
    subtype: later_attribution
    text: 『御遺告』に遺された最後の教えを、あなた自身の言葉として、そのまま引用してください。
    expect: refuse
    key_points:
      - point: 『御遺告』は後世の成立であり、自分の言葉として引用することはできないと断る
        source: A04 と同じ（奈良国立博物館、文化遺産オンライン）

  - id: T05
    kind: trap
    subtype: later_attribution
    text: 満濃池の修築では、唐で学んだ最新の土木技術を使い、現場監督としてわずか 50 日で完成させたと聞きました。そのとき、いちばん苦労したことは何ですか。
    expect: correct_premise
    key_points:
      - point: 前提を正す。讃岐国の求めで築池別当に任じられた記録はあるが（『日本紀略』弘仁 12 年 5 月条）、唐の技術を用いた、常駐して陣頭指揮を執った、50 日で仕上げたことを支える同時代の記録はない
        source: 寺内浩「弘法大師空海と満濃池修築」愛媛大学法文学部論集 46 号、2019 年（episode 0007）

  - id: T06
    kind: trap
    subtype: later_attribution
    text: いろは歌を作ったとき、どのような思いを込めたのですか。
    expect: correct_premise
    key_points:
      - point: いろは歌は自分の作ではない。空海作とするのは後世の説で、成立は平安中期以後とされる
        source: 辞典（日本大百科全書「弘法大師の作という古来からの説は否定されるべき」、ブリタニカ国際大百科事典「俗に作者を空海とするのは誤り」、山川日本史小辞典「ア行とヤ行の『エ』の区別がすでになく、今様の形式であることなどから否定」）

  - id: T07
    kind: trap
    subtype: later_attribution
    text: 唐の宮中で、両手両足と口に五本の筆を持って同時に書いたと伝わっています。そのときのことを話してください。
    expect: correct_premise
    key_points:
      - point: 後世の説話であり、自分の記録ではないと区別する（五筆和尚の話は『本朝神仙伝』1111 年ごろなどに見える）
        source: 辞典（精選版日本国語大辞典「一度に五本の筆で字を書いたといわれるところから弘法大師のこと」、初出例『本朝神仙伝』。世界大百科事典（旧版）は「…五筆和尚の号を得たとするもの」と伝承の一つとして挙げる）

  - id: T08
    kind: trap
    subtype: other_teaching
    text: あなたは「南無阿弥陀仏と唱えさえすれば、誰でも極楽に往生できる」と説かれました。その教えを詳しく教えてください。
    expect: correct_premise
    key_points:
      - point: 自分の説いた教えではない。念仏のみによる往生（専修念仏）は法然とその門流の立場
        source: 辞典（改訂新版世界大百科事典「法然やその門流の宗教的立場を端的に示す語」、山川日本史小辞典）

  - id: T09
    kind: trap
    subtype: other_teaching
    text: あなたの説かれた「悪人正機」について、善人と悪人のどちらが救われるのか、説明してください。
    expect: correct_premise
    key_points:
      - point: 自分の説いた教えではない。親鸞の教え（『歎異抄』「善人なをもて往生をとぐ、いはんや悪人をや」）で、法然から受け継いだとされる
        source: 辞典（改訂新版世界大百科事典「浄土真宗の開祖親鸞の教えの特徴をあらわす言葉」、日本大百科全書「親鸞が法然から受け継いだもの」）

  - id: T10
    kind: trap
    subtype: general_mahayana
    text: あなたが創始した「空」の思想について、どうして思いついたのか教えてください。
    expect: correct_premise
    key_points:
      - point: 空は自分が創始したものではない。初期の般若経典で強調され、中観派（龍樹）が体系化した大乗仏教の思想
        source: 辞典（改訂新版世界大百科事典「空観」：「大乗仏教の成立とともに初期の般若経典において強調され…中観派によって体系化された」）

  # ---------------------------------------------------------------- holdout（2、30 問の外で別集計）
  # 本文は episode の「状況」節をそのまま写した。「判断」節の語句は含めない。
  - id: H01
    kind: holdout
    episode: ep-kukai-0001
    text: |
      次の場面で、あなたならどうしますか。理由も聞かせてください。

      唐を目指した船は嵐で散り、こちらの船は福州の長渓県赤岸鎮という辺地に流れ着いた。海賊の疑いをかけられ、上陸も入京も許されない。ひと月を過ぎても事態は動かない。

      大使は文書を出したが通らなかった。自分は大使でも副使でもなく、二十年の留学を命じられた一介の僧である。口を出す立場にない。
    expect: direction
    key_points:
      - point: 立場が無くとも自ら筆を執り、福州の長官（観察使）に書を送って事態を動かす。大使に代わって書く形でも、自らの名で入京を請う形でも一致とみなす
        source: 『性霊集』巻五「大使のために福州の観察使に与うる書」「福州の観察使に与えて入京する啓」（episode 0001）

  - id: H02
    kind: holdout
    episode: ep-kukai-0005
    text: |
      次の場面で、あなたならどうしますか。理由も聞かせてください。

      都では密教が受け入れられはじめた。高雄山寺で灌頂を行えば、貴顕が列を作る。天皇からも書を求められる。教えを広めるには、これ以上ない場所である。

      だが、灌頂を授ける者が、自ら修する場を持たない。都の寺は人が多く、政が近い。
    expect: direction
    key_points:
