# 埋め込みモデルの選定に使う練習問題（Phase 4 設計書 手順 3。評価セット questions.yaml とは別）
#
# 評価の 10 問でモデルを選ぶと、試験問題で下見をしたことになり本番の成績が甘く出る。そこで、評価の問いが出典とする行
# （T2428 0381c17・0381c28・0382c22、T2426 0363b16・0363b22・0363c03、T2427 0374c23、T2430 0404b18・0404c08、
#  T2429 0402b10、T2203A 0011c07、T2161 1060c15・1060c19・1065a26）の近くを避け、9 点から別の箇所を選んだ。
# target は正解の書かれた行。その行を含む箇所（チャンク）が検索の上位に入れば命中とする。

questions:
  - id: D01
    text: 『即身成仏義』の冒頭の問いでは、諸経論は成仏までに何劫かかると説く、とされていますか。
    target: [T2428_.77.0381b20]
  - id: D02
    text: 『十住心論』では、世界の中央にある山を何と呼び、その周りに何があるとしていますか。
    target: [T2425_.77.0305a11]
  - id: D03
    text: 『十住心論』は地獄を、寒と熱でそれぞれいくつずつ挙げていますか。
    target: [T2425_.77.0306c08]
  - id: D04
    text: 『秘蔵宝鑰』で、声聞の教えについて玄関法師に問いかけたのは誰ですか。
    target: [T2426_.77.0366a12, T2426_.77.0366a13]
  - id: D05
    text: 『弁顕密二教論』は、如来の説法を、病と薬のどのような関係にたとえていますか。
    target: [T2427_.77.0375b02]
  - id: D06
    text: 『弁顕密二教論』で、遍照如来の法身は五智によって何種類の法身として成るとされますか。
    target: [T2427_.77.0379b25, T2427_.77.0380a20]
  - id: D07
    text: 『声字実相義』の冒頭の叙意では、如来の説法は必ず何によるとされていますか。
    target: [T2429_.77.0401c07]
  - id: D08
    text: 『吽字義』の麼字の実義で、「人」とは何を指すとされていますか。
    target: [T2430_.77.0406c13]
  - id: D09
    text: 『般若心経秘鍵』の冒頭は、仏法が遠くにあるのか近くにあるのかを、どう述べていますか。
    target: [T2203A.57.0011a10]
  - id: D10
    text: 『御請来目録』には、恵果阿闍梨の影（肖像）が何幅と記されていますか。
    target: [T2161_.55.1064b20]
  - id: D11
    text: 『御遺告』で、空海の滅後に弟子たちが師長とすべきとされたのは誰ですか。
    target: [T2431_.77.0409c26]
