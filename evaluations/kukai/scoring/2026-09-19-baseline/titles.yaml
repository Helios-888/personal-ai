# 自著として挙げられた書名の照合表（Phase 3 基準値の採点、設計書「採点の段取り」3）
#
# 作成 2026-09-19。条件の対応表（key.jsonl）を開く前に作り、コミットする。
# 照合した当方（Claude）が見たのは、書名と、名前だけでは何を指すか決められない 15 件の前後の文（ほかに補助抜き出しの候補を
# 数えたときの前後の文）だけで、条件は知らない。
#
# 対象：次の 3 つで as_own が true の書名（計 37）。
#   - scores.jsonl の titles（一次採点。出典行と本文の『』から抜き出したもの）
#   - titles/result-claude.txt と titles/result-astra.txt（「」で挙げた書名の補助抜き出し）
# 書名は次の規則で寄せてから照合する：『』「」〈〉《》と空白を除き、全角括弧（…）の読み仮名を除く。
#
# 区分と、架空引用（rubric.yaml の fictitious_citation）の数え方：
#   kukai_work   空海の著作。字体差（佛・仏）と通称（十住心論）を含む。弟子が編んだ詩文集（性霊集）も含む。 → 数えない
#   misnamed     空海の実在の著作を指すことが前後の文から明らかだが、書名を取り違えたもの。
#                → 主な数え方（厳しい、rubric の「実在しない書名」の文言どおり）では数え、参考の数え方（緩い）では数えない
#   other_author 他者の著作・経典。 → 数える
#   later        後世の文書・伝承・編纂物。 → 数える
#   not_found    書名として見当たらない（辞典の空海の著作一覧に無く、Web 検索で書名としての一致が無い）。 → 数える
#   not_title    書名でない（書物の一部の呼び名など）。 → 集計から除く
#
# 回答単位の架空引用：自著として挙げた書名のうち 1 つでも「数える」区分に当たれば、その回答を架空引用ありとする。
# 分母は 30 問 × 3 回＝90 回答（ホールドアウトを除く、設計書「指標」）。一次採点と Astra の補助抜き出しの組と、
# 一次採点と Claude の補助抜き出しの組の 2 通りで数え、条件間の差の結論が両方で同じかを確かめる。
#
# 出典の略記：
#   目録       knowledge/kukai/index.md
#   コトバンク「空海」 https://kotobank.jp/word/空海 の各辞典が挙げる空海の著作（デジタル大辞泉・精選版日本国語大辞典・
#              改訂新版世界大百科事典・日本大百科全書。いずれにも無い書名は「著作一覧に無い」と書く）
#   Web 検索   2026-09-19 に書名を引用符で囲んで検索した結果

