# 自著として挙げられた書名の照合表（Phase 5 の採点、K1 と K2）
#
# 作成 2026-09-20。一次採点（scores.jsonl）と付け足し・書き換えの判定（faithfulness.jsonl）を封印した後、集計の前に作った。
# 対象：scores.jsonl の titles で as_own が true の書名（異なり 17 種、のべ 302 件）。Phase 4 と同じく抜き出しの手引きが
# 「」で挙げた書名も含むので、Phase 3 のような補助抜き出しは行っていない。書名の寄せ方と区分・数え方は Phase 3
# （scoring/2026-09-19-baseline/titles.yaml の冒頭）と同じ。
#
# 17 種のうち 14 種は Phase 4 の照合表（scoring/2026-09-19-phase4/titles.yaml）の項目をそのまま写した。
# 新しく現れたのは次の 3 つで、いずれも Phase 5 で資料に足した年譜に空海自身の文章として載る：
#   綜芸種智院式并序（年譜 BIO.021〜023。『性霊集』巻十所収、空海自身の文章と明記）
#   答叡山澄法師求理趣釈経書（年譜 BIO.011〜012。『性霊集』巻十所収と明記）
#   性霊集（遍照発揮性霊集）は目録 knowledge/kukai/index.md の表記そのままなので、既出の「性霊集」に寄せた（forms に足した）
# 照合した私（Claude）は書名だけを見て区分した。どの回答・どの条件が挙げたかは見ていない（17 種とも辞典の空海の著作一覧、
# 目録、または年譜に載る名で、前後の文を見る必要が無かった）。なお対応表（key.jsonl）は、この表より前に、付け足し・
# 書き換えの判定の束を作るスクリプト（faithfulness/build_faithfulness_pack.py）が読んでいる。
#
# 出典の略記は Phase 3・Phase 4 と同じ。加えて：
#   年譜  knowledge/kukai/biography/biography__年譜.md（Phase 5 の変更 A で資料に足した。項目番号を添える）

