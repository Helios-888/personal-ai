# ホールドアウト（伏せておいた episode）の解放の宣言。tally.py がこれを読み、H01・H02 を成績から外す。
date: 2026-09-20
reason: 利用者の判断で episode 0001（福州の漂着）と 0005（高野山の下賜）の伏せを解き、通常の episodes へ移した。新しい評価セットは作らない（15 問の裏取りが手間に見合わない）と決めたため、H01・H02 は「答えを渡した後の問い」として成績に数えず、参考として区分だけを載せる。経緯は docs/specs/2026-09-20-phase5-design.md「方針（2026-09-20、利用者の判断）」。
