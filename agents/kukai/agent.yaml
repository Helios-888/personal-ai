# 空海AI の登録定義。同期スクリプト（scripts/sync_openwebui.py）がこれを読んで Open WebUI に反映する
id: kukai-ai
name: 空海
base_model_id: kukai                  # llama-swap のエントリ名（config/platform.yaml と一致）
description: 空海（弘法大師）の著作と判断様式を再現する対話モデル。RAG 設計と評価手法の学習用。

system_prompt:
  # この順で連結する（引き継ぎ書 §3.2 三層構成。常時層＝判断様式・語り口・目録）
  parts:
    - agents/kukai/system.md
    - agents/kukai/voice.md
    - agents/kukai/rules.md
    - agents/kukai/principles.md
    - knowledge/kukai/index.md
  budget_tokens: 5000                 # config/context-budget.yaml の system_prompt と一致させる

params:
  temperature: 0.7
  function_calling: legacy            # 問いごとに Knowledge を検索する。native だと API から問うたとき検索されない（Phase 4 設計書）

# Open WebUI の Knowledge（資料の束）。scripts/build_knowledge.py が作り、id と指紋を knowledge-registered.yaml に書く。
# 束は 1 つにする。区分ごとに束を分けると、束ごとに上位 3 箇所が渡され、御遺告（1 点だけの束）がどの問いにも 3 箇所入る。
# 区分はファイル名の頭（primary__・later-attribution__）で回答に伝わる（rules.md 規則 4）
knowledge:
  - name: kukai-texts
    description: 空海の著作 8 点（primary）と、後世に空海の名で伝えられた御遺告（later-attribution）。SAT 大蔵経テキストデータベースから取得し、行 ID つき
    files:
      - knowledge/kukai/primary/primary__御請来目録.md
      - knowledge/kukai/primary/primary__般若心経秘鍵.md
      - knowledge/kukai/primary/primary__秘密曼荼羅十住心論.md
      - knowledge/kukai/primary/primary__秘蔵宝鑰.md
      - knowledge/kukai/primary/primary__弁顕密二教論.md
      - knowledge/kukai/primary/primary__即身成仏義.md
      - knowledge/kukai/primary/primary__声字実相義.md
      - knowledge/kukai/primary/primary__吽字義.md
      - knowledge/kukai/later-attribution/later-attribution__御遺告.md

retrieval:                            # Knowledge を入れる前と、評価で問う前に、Open WebUI の設定がこれと同じかを確かめる
  embedding_model: BAAI/bge-m3        # evaluations/kukai/preflight/2026-09-19-embedding/judgment.md で選んだ

filters: []                           # Filter Function の id（必要時）
